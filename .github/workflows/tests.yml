name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            device: iPhone 18 Pro
          - name: iPad
            device: iPad Pro 13-inch (M5)
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app

      - name: Run unit tests
        run: >
          xcodebuild test
          -project atlas.xcodeproj
          -scheme atlasTests
          -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=27.0"
          -enableCodeCoverage YES
          -resultBundlePath UnitTests.xcresult

      - name: Coverage
        if: ${{ !cancelled() && hashFiles('UnitTests.xcresult/**') != '' }}
        run: |
          {
            echo "### Coverage (${{ matrix.name }})"
            echo '```'
            xcrun xccov view --report --only-targets UnitTests.xcresult
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.name }}
          path: UnitTests.xcresult

  ui-tests:
    name: UI tests (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            device: iPhone 18 Pro
          - name: iPad
            device: iPad Pro 13-inch (M5)
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app

      - name: Boot the simulator
        id: simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r --arg name "$DEVICE" '
            .devices | to_entries[] | select(.key | endswith("iOS-27-0")) | .value[] | select(.name == $name) | .udid
          ' | head -n 1)
          test -n "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: >
          xcodebuild build-for-testing
          -project atlas.xcodeproj
          -scheme atlasUITests
          -destination "id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath DerivedData

      - name: Run UI tests
        run: >
          xcodebuild test-without-building
          -project atlas.xcodeproj
          -scheme atlasUITests
          -destination "id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath DerivedData
          -parallel-testing-enabled NO
          -retry-tests-on-failure
          -test-iterations 2
          -resultBundlePath UITests.xcresult

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.name }}
          path: UITests.xcresult
